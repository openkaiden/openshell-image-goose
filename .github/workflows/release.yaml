name: release

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
      branch:
        description: 'Branch to use for the release'
        required: true
        default: main

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  tag:
    name: Tagging
    runs-on: ubuntu-24.04
    outputs:
      githubTag: ${{ steps.tag-util.outputs.githubTag }}
      version: ${{ steps.tag-util.outputs.version }}
      releaseId: ${{ steps.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Generate tag utilities
        id: tag-util
        run: |
          echo "githubTag=v${{ github.event.inputs.version }}" >> ${GITHUB_OUTPUT}
          echo "version=${{ github.event.inputs.version }}" >> ${GITHUB_OUTPUT}

      - name: Tag
        run: |
          git config --local user.name ${{ github.actor }}
          git config --local user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          echo "Tagging with ${{ steps.tag-util.outputs.githubTag }}"
          git tag ${{ steps.tag-util.outputs.githubTag }}
          git push origin ${{ steps.tag-util.outputs.githubTag }}

      - name: Create Release
        id: create-release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.tag-util.outputs.githubTag }}
          name: ${{ steps.tag-util.outputs.githubTag }}
          draft: true
          prerelease: false

  build:
    name: Build and publish OCI image
    runs-on: ubuntu-24.04
    needs: tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.githubTag }}

      - name: Install qemu dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@5d8479758cc72ed82df28daba521d27e20ff8c8a # v3.0.0
        with:
          image: openshell-image-goose
          tags: latest ${{ needs.tag.outputs.version }}
          platforms: linux/amd64, linux/arm64
          containerfiles: |
            ./Containerfile
          context: .
          oci: true

      - name: Log in to ghcr.io
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: Push to ghcr.io
        id: push-to-ghcr
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ghcr.io/${{ github.repository_owner }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/openshell-image-goose
          subject-digest: ${{ steps.push-to-ghcr.outputs.digest }}
          push-to-registry: true

  release:
    needs: [tag, build]
    name: Publish release
    runs-on: ubuntu-24.04
    steps:
      - name: Publish release
        uses: StuYarrow/publish-release@01f2a1365bacd77bad861873a7fdf274ab49eefd # v1.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          id: ${{ needs.tag.outputs.releaseId }}
